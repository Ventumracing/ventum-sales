name: Sync Firebase Sales Data

"on":
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin --quiet

      - name: Fetch Firebase data
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: python3 scripts/fetch_sales.py sales.json

      - name: Generate CSV report
        run: python3 scripts/json_to_csv.py sales.json sales-report.csv

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add sales.json sales-report.csv
          git diff --staged --quiet || git commit -m "Auto-sync sales data $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
